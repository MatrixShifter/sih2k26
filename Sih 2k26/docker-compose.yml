services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: complygem
      POSTGRES_PASSWORD: complygem
      POSTGRES_DB: complygem
    ports:
      - "5432:5432"
    volumes:
      - complygem_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complygem -d complygem"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://complygem:complygem@postgres:5432/complygem
      SECRET_KEY: local-dev-change-me-complygem-ai
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - complygem_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  complygem_pg:
  complygem_uploads:
